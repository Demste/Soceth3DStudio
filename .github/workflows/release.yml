name: Package Windows release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the audited package
        run: |
          $version = (Get-Content shared/release.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The release tag must match shared/release.json.'
          }
          python scripts/audit_release.py --history
          python scripts/audit_dependencies.py
          npm --prefix apps/desktop ci --no-audit --no-fund
          npm --prefix apps/desktop audit --audit-level=high
          npm --prefix apps/desktop run build
          python scripts/package_release.py --output release-output
      - uses: actions/upload-artifact@v4
        with:
          name: Soceth3DStudio-Windows
          path: release-output/*
  publish:
    if: github.ref_type == 'tag'
    needs: package
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Soceth3DStudio-Windows
          path: release-output
      - name: Verify and publish Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $stem = 'Soceth3DStudio-' + $env:GITHUB_REF_NAME.Substring(1) + '-Windows.zip'
          $archive = Join-Path release-output $stem
          $checksum = "$archive.sha256"
          $expected = ((Get-Content -Raw -LiteralPath $checksum).Trim() -split '\s+')[0]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expected) {
            throw 'The Windows ZIP checksum does not match.'
          }
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes $archive $checksum
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub release.' }
